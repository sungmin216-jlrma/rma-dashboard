<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUO(ADP) EC Notice Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #1a1a2e; }

  header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
    color: white; padding: 20px 30px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  header span { font-size: 12px; opacity: 0.7; }

  .stats-bar {
    display: flex; gap: 12px; padding: 16px 30px;
    background: white; border-bottom: 1px solid #e0e0e0;
    flex-wrap: wrap;
  }
  .stat-card {
    background: #f8f9ff; border: 1px solid #e0e6ff;
    border-radius: 8px; padding: 10px 18px;
    text-align: center; min-width: 100px;
  }
  .stat-card .num { font-size: 22px; font-weight: 700; color: #0f3460; }
  .stat-card .lbl { font-size: 11px; color: #888; margin-top: 2px; }

  .toolbar {
    display: flex; gap: 10px; padding: 14px 30px;
    background: white; border-bottom: 1px solid #e0e0e0;
    flex-wrap: wrap; align-items: center;
  }
  .toolbar input {
    flex: 1; min-width: 220px; padding: 8px 14px;
    border: 1px solid #ddd; border-radius: 6px; font-size: 13px;
    outline: none;
  }
  .toolbar input:focus { border-color: #0f3460; }
  .toolbar select {
    padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px;
    font-size: 13px; background: white; cursor: pointer; outline: none;
  }
  .toolbar select:focus { border-color: #0f3460; }
  .count-badge {
    margin-left: auto; background: #0f3460; color: white;
    border-radius: 20px; padding: 4px 14px; font-size: 12px; font-weight: 600;
  }

  .table-wrap { padding: 16px 30px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: white;
    border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  thead tr { background: #0f3460; color: white; }
  thead th {
    padding: 11px 12px; font-size: 12px; font-weight: 600;
    text-align: left; white-space: nowrap; cursor: pointer; user-select: none;
  }
  thead th:hover { background: #1a4a80; }
  thead th.sorted-asc::after { content: ' ▲'; font-size: 10px; }
  thead th.sorted-desc::after { content: ' ▼'; font-size: 10px; }

  tbody tr { border-bottom: 1px solid #f0f0f0; transition: background 0.15s; }
  tbody tr:hover { background: #f5f8ff; }
  tbody td { padding: 9px 12px; font-size: 12px; vertical-align: middle; }

  .ec-no { font-weight: 700; color: #0f3460; white-space: nowrap; }
  .bu-badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 10px; font-weight: 700;
  }
  .bu-GDBU { background: #e8f4fd; color: #1a6fb5; }
  .bu-PDBU { background: #fdecea; color: #c0392b; }

  .model { font-family: monospace; font-size: 11px; color: #555; }
  .new-name { font-family: monospace; font-size: 11px; color: #27ae60; }
  .ec-item { max-width: 200px; line-height: 1.4; }

  .file-link {
    display: inline-block; padding: 3px 8px; border-radius: 4px;
    font-size: 11px; text-decoration: none; margin: 1px;
    white-space: nowrap;
  }
  .link-notice { background: #e8f4fd; color: #1565c0; border: 1px solid #b3d4f5; }
  .link-report { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  .file-link:hover { opacity: 0.75; }

  .date { white-space: nowrap; font-size: 11px; color: #777; }
  .remarks { max-width: 160px; font-size: 11px; color: #888; line-height: 1.4; }

  .status-gd { background:#fff3cd; color:#856404; padding:2px 7px; border-radius:10px; font-size:10px; font-weight:700; }

  .no-results { text-align: center; padding: 40px; color: #aaa; font-size: 14px; }

  /* Add modal */
  .add-btn {
    background: #0f3460; color: white; border: none; border-radius: 6px;
    padding: 8px 16px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .add-btn:hover { background: #1a4a80; }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white; border-radius: 12px;
    padding: 28px; width: 640px; max-width: 95vw;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .modal h2 { font-size: 16px; margin-bottom: 20px; color: #0f3460; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 12px; font-weight: 600; color: #555; }
  .form-group input, .form-group select, .form-group textarea {
    padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px;
    font-size: 13px; outline: none; font-family: inherit;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: #0f3460;
  }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .btn-cancel {
    background: #f0f0f0; color: #555; border: none; border-radius: 6px;
    padding: 8px 16px; cursor: pointer; font-size: 13px;
  }
  .btn-save {
    background: #0f3460; color: white; border: none; border-radius: 6px;
    padding: 8px 20px; cursor: pointer; font-size: 13px; font-weight: 600;
  }

  @media (max-width: 600px) {
    .stats-bar, .toolbar, .table-wrap { padding: 12px 12px; }
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>📋 AUO(ADP) EC Notice Dashboard</h1>
  <span id="last-updated">마지막 업데이트: 2026-06-02</span>
</header>

<div class="stats-bar">
  <div class="stat-card"><div class="num" id="stat-total">0</div><div class="lbl">전체</div></div>
  <div class="stat-card"><div class="num" id="stat-gdbu">0</div><div class="lbl">GDBU</div></div>
  <div class="stat-card"><div class="num" id="stat-pdbu">0</div><div class="lbl">PDBU</div></div>
  <div class="stat-card"><div class="num" id="stat-has-notice">0</div><div class="lbl">Notice 첨부</div></div>
  <div class="stat-card"><div class="num" id="stat-has-report">0</div><div class="lbl">Report 첨부</div></div>
  <div class="stat-card"><div class="num" id="stat-2026">0</div><div class="lbl">2026년</div></div>
  <div class="stat-card"><div class="num" id="stat-2025">0</div><div class="lbl">2025년</div></div>
</div>

<div class="toolbar">
  <input type="text" id="search" placeholder="🔍  EC No, 모델명, EC ITEM 검색...">
  <select id="filter-bu">
    <option value="">전체 BU</option>
    <option value="GDBU">GDBU</option>
    <option value="PDBU">PDBU</option>
  </select>
  <select id="filter-year">
    <option value="">전체 연도</option>
  </select>
  <select id="filter-has-file">
    <option value="">파일 여부</option>
    <option value="notice">Notice 있음</option>
    <option value="report">Report 있음</option>
    <option value="both">둘 다 있음</option>
  </select>
  <button class="add-btn" onclick="openModal()">+ 새 EC 추가</button>
  <span class="count-badge" id="result-count">0 건</span>
</div>

<div class="table-wrap">
  <table id="ec-table">
    <thead>
      <tr>
        <th onclick="sortTable('ec_no')">#</th>
        <th onclick="sortTable('ec_no')">ADP EC No.</th>
        <th onclick="sortTable('bu')">BU</th>
        <th onclick="sortTable('issue_date')">Issue Date</th>
        <th onclick="sortTable('model_name')">Model Name</th>
        <th>New Name</th>
        <th>EC ITEM</th>
        <th>EC Notice</th>
        <th>EC Report</th>
        <th onclick="sortTable('target_phase')">Target Phase-in</th>
        <th>Remarks</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
  <div class="no-results" id="no-results" style="display:none">검색 결과가 없습니다.</div>
</div>

<!-- Add Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2>새 EC Notice 추가</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>ADP EC No. *</label>
        <input type="text" id="f-ec_no" placeholder="예: GP260500xxx">
      </div>
      <div class="form-group">
        <label>BU *</label>
        <select id="f-bu">
          <option value="GDBU">GDBU</option>
          <option value="PDBU">PDBU</option>
        </select>
      </div>
      <div class="form-group">
        <label>Issue Date</label>
        <input type="date" id="f-issue_date">
      </div>
      <div class="form-group">
        <label>Target Phase-in</label>
        <input type="text" id="f-target_phase" placeholder="예: 2026년 10월 1일">
      </div>
      <div class="form-group">
        <label>Model Name</label>
        <input type="text" id="f-model_name" placeholder="예: G150XTN03.404">
      </div>
      <div class="form-group">
        <label>New Name</label>
        <input type="text" id="f-new_name" placeholder="예: G150XTN03.410">
      </div>
      <div class="form-group full">
        <label>EC ITEM</label>
        <input type="text" id="f-ec_item" placeholder="변경 항목 설명">
      </div>
      <div class="form-group">
        <label>EC Notice 파일명</label>
        <input type="text" id="f-ec_notice" placeholder="파일명.pdf (같은 폴더에 저장)">
      </div>
      <div class="form-group">
        <label>EC Report 파일명</label>
        <input type="text" id="f-ec_report" placeholder="파일명.pdf (같은 폴더에 저장)">
      </div>
      <div class="form-group">
        <label>Q'ty</label>
        <input type="text" id="f-qty">
      </div>
      <div class="form-group">
        <label>Status</label>
        <input type="text" id="f-status">
      </div>
      <div class="form-group full">
        <label>Remarks</label>
        <textarea id="f-remarks"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="addRecord()">저장</button>
    </div>
  </div>
</div>

let data = JSON.parse(JSON.stringify(RAW_DATA));
let sortKey = 'issue_date';
let sortDir = -1;
let activeQuickFilter = null;
const CURRENT_YEAR = String(new Date().getFullYear());

const years = [...new Set(data.map(d => d.issue_date.substring(0,4)).filter(y=>y))].sort().reverse();
const yearSel = document.getElementById('filter-year');
years.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y+'년';yearSel.appendChild(o);});

function getYear(d){return d.issue_date?d.issue_date.substring(0,4):'';}

function updateStats(){
  document.getElementById('stat-total').textContent=data.length;
  document.getElementById('stat-gdbu').textContent=data.filter(d=>d.bu==='GDBU').length;
  document.getElementById('stat-pdbu').textContent=data.filter(d=>d.bu==='PDBU').length;
  const n=data.filter(d=>d.ec_notice).length;
  document.getElementById('stat-has-notice').textContent=n;
  document.getElementById('stat-has-report').textContent=data.filter(d=>d.ec_report).length;
  document.getElementById('stat-no-notice').textContent=data.length-n;
  const ce=document.getElementById('stat-2026');
  const cl=document.getElementById('stat-cur-year-lbl');
  const cl2=document.getElementById('stat-cur-year-lbl2');
  if(ce)ce.textContent=data.filter(d=>getYear(d)===CURRENT_YEAR).length;
  if(cl)cl.textContent=CURRENT_YEAR+' EC 건수';
  if(cl2)cl2.textContent=CURRENT_YEAR+'년';
  const yc={};
  data.forEach(d=>{const y=getYear(d);if(y)yc[y]=(yc[y]||0)+1;});
  const sy=Object.keys(yc).sort().reverse();
  const mx=Math.max(...Object.values(yc));
  const c=document.getElementById('year-bars');
  if(c)c.innerHTML=sy.map(y=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;"><span style="font-size:11px;color:#555;width:26px;flex-shrink:0;">'${y.slice(2)}</span><div style="flex:1;height:7px;background:#e8eaf0;border-radius:4px;overflow:hidden;"><div style="width:${Math.round(yc[y]/mx*100)}%;height:100%;border-radius:4px;background:#378ADD;"></div></div><span style="font-size:12px;font-weight:700;color:#0f3460;width:20px;text-align:right;">${yc[y]}</span></div>`).join('');
}

function toggleYearDD(){
  const dd=document.getElementById('year-dropdown');
  const ch=document.getElementById('year-chevron');
  const isOpen=dd.style.display!=='none';
  dd.style.display=isOpen?'none':'block';
  ch.style.transform=isOpen?'':'rotate(180deg)';
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#total-card')&&!e.target.closest('#year-dropdown')){
    const dd=document.getElementById('year-dropdown');
    if(dd){dd.style.display='none';document.getElementById('year-chevron').style.transform='';}
  }
});

function makeFileLinks(files,cls,label){
  if(!files)return'';
  return files.split(',').map(f=>{
    f=f.trim();if(!f)return'';
    const decoded=decodeURIComponent(f);
    return`<a class="file-link ${cls}" href="files/${f}" target="_blank" title="${decoded}">📄 ${label}</a>`;
  }).join('');
}

function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const bu=document.getElementById('filter-bu').value;
  const yr=document.getElementById('filter-year').value;
  const file=document.getElementById('filter-has-file').value;
  let filtered=data.filter(d=>{
    const txt=(d.ec_no+d.model_name+d.ec_item+d.new_name+d.remarks).toLowerCase();
    if(q&&!txt.includes(q))return false;
    if(bu&&d.bu!==bu)return false;
    if(yr&&getYear(d)!==yr)return false;
    if(file==='notice'&&!d.ec_notice)return false;
    if(file==='report'&&!d.ec_report)return false;
    if(file==='both'&&(!d.ec_notice||!d.ec_report))return false;
    if(activeQuickFilter==='no-notice'&&d.ec_notice)return false;
    return true;
  });
  filtered.sort((a,b)=>{let va=a[sortKey]||'',vb=b[sortKey]||'';return va<vb?sortDir:va>vb?-sortDir:0;});
  document.getElementById('result-count').textContent=filtered.length;
  const tbody=document.getElementById('table-body');
  if(filtered.length===0){tbody.innerHTML='';document.getElementById('no-results').style.display='block';return;}
  document.getElementById('no-results').style.display='none';
  tbody.innerHTML=filtered.map((d,i)=>`<tr><td style="color:#aaa;font-size:11px">${i+1}</td><td class="ec-no">${d.ec_no||'-'}</td><td><span class="bu-badge bu-${d.bu}">${d.bu}</span></td><td class="date">${d.issue_date||''}</td><td class="model">${d.model_name}</td><td class="new-name">${d.new_name||''}</td><td><div class="ec-item-wrap" data-idx="${i}"><span class="ec-item-text" title="${(d.ec_item||'').replace(/"/g,'&quot;')}">${d.ec_item||''}</span><span class="edit-icon" onclick="startEditItem(this,${i})" title="편집">✏️</span></div></td><td>${makeFileLinks(d.ec_notice,'link-notice','Notice')}</td><td>${makeFileLinks(d.ec_report,'link-report','Report')}</td><td class="date">${d.target_phase||''}</td><td><div class="remarks-wrap" data-idx="${i}"><span class="remarks-text" title="${(d.remarks||'').replace(/"/g,'&quot;')}">${d.remarks||''}</span><span class="edit-icon" onclick="startEditRemarks(this,${i})" title="편집">✏️</span></div></td><td>${d.status?`<span class="status-gd">${d.status}</span>`:''}</td></tr>`).join('');
}

function sortTable(key){if(sortKey===key)sortDir*=-1;else{sortKey=key;sortDir=-1;}document.querySelectorAll('thead th').forEach(th=>{th.classList.remove('sorted-asc','sorted-desc');if(th.getAttribute('onclick')===`sortTable('${key}')`)th.classList.add(sortDir===1?'sorted-asc':'sorted-desc');});render();}
function resetAllFilters(){document.getElementById('search').value='';document.getElementById('search-clear').classList.remove('visible');document.getElementById('filter-bu').value='';document.getElementById('filter-year').value='';document.getElementById('filter-has-file').value='';activeQuickFilter=null;render();}
function exportCSV(){
  const q=document.getElementById('search').value.toLowerCase(),bu=document.getElementById('filter-bu').value,yr=document.getElementById('filter-year').value,file=document.getElementById('filter-has-file').value;
  let filtered=data.filter(d=>{const txt=(d.ec_no+d.model_name+d.ec_item+d.new_name+d.remarks).toLowerCase();if(q&&!txt.includes(q))return false;if(bu&&d.bu!==bu)return false;if(yr&&getYear(d)!==yr)return false;if(file==='notice'&&!d.ec_notice)return false;if(file==='report'&&!d.ec_report)return false;if(file==='both'&&(!d.ec_notice||!d.ec_report))return false;if(activeQuickFilter==='no-notice'&&d.ec_notice)return false;return true;});
  const headers=['ADP EC No.','BU','Issue Date','Model Name','New Name','EC ITEM','EC Notice','EC Report','Target Phase-in','Remarks','Status'];
  const keys=['ec_no','bu','issue_date','model_name','new_name','ec_item','ec_notice','ec_report','target_phase','remarks','status'];
  const esc=v=>`"${String(v||'').replace(/"/g,'""')}"`;
  const rows=[headers.map(esc).join(',')];filtered.forEach(d=>rows.push(keys.map(k=>esc(d[k])).join(',')));
  const blob=new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  const now=new Date();const pad=n=>String(n).padStart(2,'0');
  a.href=url;a.download=`EC_Notice_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}.csv`;a.click();URL.revokeObjectURL(url);
}
function onSearchInput(){const val=document.getElementById('search').value;document.getElementById('search-clear').classList.toggle('visible',val.length>0);render();}
function clearSearch(){document.getElementById('search').value='';document.getElementById('search-clear').classList.remove('visible');render();}
['filter-bu','filter-year','filter-has-file'].forEach(id=>{document.getElementById(id).addEventListener('input',render);document.getElementById(id).addEventListener('change',render);});
function startEditItem(iconEl,idx){const wrap=iconEl.closest('.ec-item-wrap');const cv=data[idx].ec_item||'';wrap.innerHTML=`<input class="ec-item-input" id="ec-item-edit" value="${cv.replace(/"/g,'&quot;')}"/><span class="edit-icon" onclick="saveEditItem(${idx})">✅</span><span class="edit-icon" onclick="cancelEdit()">✖</span>`;const inp=document.getElementById('ec-item-edit');inp.focus();inp.select();inp.addEventListener('keydown',e=>{if(e.key==='Enter')saveEditItem(idx);if(e.key==='Escape')cancelEdit();});}
function saveEditItem(idx){const inp=document.getElementById('ec-item-edit');if(!inp)return;data[idx].ec_item=inp.value.trim();updateLastUpdated();render();}
function startEditRemarks(iconEl,idx){const wrap=iconEl.closest('.remarks-wrap');const cv=data[idx].remarks||'';wrap.innerHTML=`<input class="remarks-input" id="remarks-edit" value="${cv.replace(/"/g,'&quot;')}"/><span class="edit-icon" onclick="saveEditRemarks(${idx})">✅</span><span class="edit-icon" onclick="cancelEdit()">✖</span>`;const inp=document.getElementById('remarks-edit');inp.focus();inp.select();inp.addEventListener('keydown',e=>{if(e.key==='Enter')saveEditRemarks(idx);if(e.key==='Escape')cancelEdit();});}
function saveEditRemarks(idx){const inp=document.getElementById('remarks-edit');if(!inp)return;data[idx].remarks=inp.value.trim();updateLastUpdated();render();}
function cancelEdit(){render();}
function updateLastUpdated(){const now=new Date();const pad=n=>String(n).padStart(2,'0');document.getElementById('last-updated').textContent=`마지막 업데이트: ${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;}
function openModal(){document.getElementById('modal-overlay').classList.add('open');}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
function buildRecordFromForm(){const get=id=>document.getElementById(id).value.trim();const ecNo=get('f-ec_no');if(!ecNo){alert('ADP EC No.를 입력하세요.');return null;}const issueRaw=get('f-issue_date');return{ec_no:ecNo,bu:get('f-bu'),ec_item:get('f-ec_item'),ec_notice:get('f-ec_notice'),ec_report:get('f-ec_report'),issue_date:issueRaw?issueRaw.replace(/-/g,'/'):'',model_name:get('f-model_name'),new_name:get('f-new_name'),qty:get('f-qty'),remarks:get('f-remarks'),status:get('f-status'),target_phase:get('f-target_phase')};}
function addRecord(){const rec=buildRecordFromForm();if(!rec)return;data.unshift(rec);updateStats();render();closeModal();updateLastUpdated();['f-ec_no','f-ec_item','f-ec_notice','f-ec_report','f-issue_date','f-model_name','f-new_name','f-qty','f-remarks','f-status','f-target_phase'].forEach(id=>document.getElementById(id).value='');}
function addRecordAndMail(){const rec=buildRecordFromForm();if(!rec)return;data.unshift(rec);updateStats();render();closeModal();updateLastUpdated();openMailModal(rec);}
function buildMailHtml(rec){const bu=rec.bu||'',model=rec.model_name||'',newModel=rec.new_name||model,ecItem=rec.ec_item||'',phase=rec.target_phase||'',status=rec.status||'EC Notice';return`안녕하세요.\n\n품질팀 김성민입니다.\n\n${bu} 품목 ${model} 모델의 EC가 발생하여 하기와 같이 안내 드립니다.\n\n아래의 표와 첨부파일을 확인하시어 샘플 필요 시 회신 부탁드리겠습니다.\n\n<table><tr><th>Model name</th><th>New model name</th><th>EC item</th><th>적용 시점</th><th>Status</th></tr><tr><td>${model}</td><td>${newModel}</td><td>${ecItem}</td><td>${phase}</td><td>${status}</td></tr></table>`;}
function buildMailPlainText(rec){return`안녕하세요.\n\n품질팀 김성민입니다.\n\n${rec.bu||''} 품목 ${rec.model_name||''} 모델의 EC가 발생하여 하기와 같이 안내 드립니다.\n\n아래의 표와 첨부파일을 확인하시어 샘플 필요 시 회신 부탁드리겠습니다.\n\nModel name: ${rec.model_name||''}\nNew model name: ${rec.new_name||''}\nEC item: ${rec.ec_item||''}\n적용 시점: ${rec.target_phase||''}\nStatus: ${rec.status||'EC Notice'}`;}
let _mailPlain='';
function openMailModal(rec){_mailPlain=buildMailPlainText(rec);document.getElementById('mail-preview-body').innerHTML=buildMailHtml(rec);document.getElementById('mail-copy-btn').textContent='📋 텍스트 복사';document.getElementById('mail-copy-btn').className='mail-copy-btn';document.getElementById('mail-overlay').classList.add('open');}
function copyMailText(){navigator.clipboard.writeText(_mailPlain).then(()=>{const btn=document.getElementById('mail-copy-btn');btn.textContent='✅ 복사됨!';btn.className='mail-copy-btn copied';setTimeout(()=>{btn.textContent='📋 텍스트 복사';btn.className='mail-copy-btn';},2000);});}
document.getElementById('mail-overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open');});
const MEMO_KEY='ec_dashboard_memo';let memoTimer=null;
function saveMemo(){clearTimeout(memoTimer);memoTimer=setTimeout(()=>{const val=document.getElementById('team-memo').value;try{localStorage.setItem(MEMO_KEY,val);}catch(e){}const lbl=document.getElementById('memo-saved-lbl');if(lbl){lbl.textContent='저장됨 ✓';setTimeout(()=>{lbl.textContent='';},2000);}},600);}
(function loadMemo(){try{const s=localStorage.getItem(MEMO_KEY);if(s)document.getElementById('team-memo').value=s;}catch(e){}}())

updateStats();
render();
</script>
</body>
</html>
